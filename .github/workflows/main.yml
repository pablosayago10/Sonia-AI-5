name: Build Sonia AI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install SDK and NDK
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Extract Sonia AI
        run: unzip -q SoniaAI_GitHub_Actions.zip -d .

      - name: Build APK
        working-directory: SoniaAI_Proyecto
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SoniaAI-debug-apk
          path: SoniaAI_Proyecto/app/build/outputs/apk/debug/app-debug.apk
